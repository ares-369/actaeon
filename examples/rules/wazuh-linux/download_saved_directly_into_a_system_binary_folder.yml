title: Download saved directly into a system binary folder
id: 3164ea83-9a33-4466-afaa-83d6a02d5d45
status: experimental
description: wget or curl wrote a file straight into a folder on the default PATH;
  installers and package managers do not do this.
author: Actaeon
logsource:
  product: linux
  service: wazuh
detection:
  dl:
    full_log|re: (?i)\b(wget|curl)\b[^\n]*\s-(O|o|-output|-output-document)[=\s]+/(usr/local/bin|usr/local/sbin|usr/bin|usr/sbin|bin|sbin)/
  condition: dl
level: high
tags:
- attack.t1105
falsepositives:
- Administrators installing a single binary tool this way
