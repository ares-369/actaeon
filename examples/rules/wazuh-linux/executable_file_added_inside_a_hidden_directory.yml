title: Executable file added inside a hidden directory
id: d0615595-6bc3-4b9d-8116-01c8058c454c
status: experimental
description: Integrity monitoring saw a new file in a hidden directory under a system
  or application path (/usr, /opt, /var/lib, /srv, /etc).
author: Actaeon
logsource:
  product: linux
  service: wazuh
detection:
  sel:
    syscheck.event: added
    syscheck.path|re: ^/(usr|opt|var/lib|srv|etc)/(.*/)?\.[^/]+/[^/]+$
  condition: sel
level: high
tags:
- attack.t1564.001
falsepositives:
- Applications that keep caches in dot-directories under /opt or /var/lib
