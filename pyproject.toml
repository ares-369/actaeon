[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actaeon"
version = "0.1.0b1"
description = "Open-source AI threat hunter that works through MCP connectors (beta)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ares-369" }]
keywords = ["security", "threat-hunting", "blue-team", "soc", "mcp", "llm", "detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
]
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=0.3"]
openai = ["openai>=1.40"]
oidc = ["authlib>=1.3"]
pdf = ["pypdf>=4"]
reports = ["python-docx>=1.1", "reportlab>=4.0"]
sigma = ["pysigma>=1.0"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
all = ["anthropic>=0.40", "google-genai>=0.3", "openai>=1.40", "authlib>=1.3", "pypdf>=4", "python-docx>=1.1", "reportlab>=4.0", "pysigma>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "pypdf>=4", "python-docx>=1.1", "reportlab>=4.0", "pysigma>=1.0"]

[project.scripts]
actaeon = "actaeon.cli:cli_main"

[tool.setuptools.packages.find]
include = ["actaeon*"]

[tool.setuptools.package-data]
actaeon = ["templates/*.html", "static/**/*", "config.example.yaml", "hunt/*.json", "hunts/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM105", "SIM108", "RUF012"]
