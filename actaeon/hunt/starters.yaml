# Starter hypotheses. Generic on purpose: no product names and no queries.
# The model writes the queries for your data. Check the ATT&CK IDs before you rely on them.
- name: Encoded PowerShell from Office
  hypothesis: An Office application started PowerShell with an encoded or hidden command line in the last 7 days.
  attack: [T1059.001, T1204.002]
  roles: [endpoint, log_search]
- name: LSASS memory access
  hypothesis: A process that is not a known security or system tool opened LSASS memory in the last 7 days.
  attack: [T1003.001]
  roles: [endpoint, log_search]
- name: New scheduled task by an unusual parent
  hypothesis: A scheduled task was created by a script host, Office application or user-writable path in the last 7 days.
  attack: [T1053.005]
  roles: [endpoint, log_search]
- name: Run key persistence
  hypothesis: A registry Run or RunOnce value was added pointing at a user-writable or temporary path in the last 7 days.
  attack: [T1547.001]
  roles: [endpoint, log_search]
- name: Remote service execution
  hypothesis: A service was created remotely on a host, or an admin share was used to copy and run a binary, in the last 7 days.
  attack: [T1021.002, T1569.002]
  roles: [endpoint, log_search, network]
- name: Password spraying
  hypothesis: One source failed to sign in to many different accounts within a short window in the last 24 hours.
  attack: [T1110.003]
  roles: [identity, log_search]
- name: New privileged account
  hypothesis: An account was created or added to a privileged group outside a change window in the last 7 days.
  attack: [T1136, T1098]
  roles: [identity, log_search]
- name: Security tool tampering
  hypothesis: A security agent or logging service was stopped, uninstalled or had its settings changed in the last 7 days.
  attack: [T1685]
  roles: [endpoint, log_search]
- name: Event log clearing
  hypothesis: A Windows event log was cleared on any host in the last 30 days.
  attack: [T1685.005]
  roles: [endpoint, log_search]
- name: Signed binary proxy execution
  hypothesis: rundll32, regsvr32 or mshta loaded a script or DLL from a remote location or a user-writable path in the last 7 days.
  attack: [T1218.011, T1218.010, T1218.005]
  roles: [endpoint, log_search]
- name: Tool download with built-in utilities
  hypothesis: certutil, bitsadmin or a script host downloaded a file from the internet in the last 7 days.
  attack: [T1105]
  roles: [endpoint, log_search, network]
- name: Beaconing
  hypothesis: A host made regular, evenly spaced connections to one rare external destination over the last 24 hours.
  attack: [T1071.001]
  roles: [network, log_search]
- name: Unusual DNS
  hypothesis: A host made many DNS queries with long or random-looking subdomains to one domain in the last 24 hours.
  attack: [T1071.004, T1048]
  roles: [network, log_search]
- name: Upload to cloud storage
  hypothesis: A host uploaded an unusually large amount of data to a cloud storage or file-sharing service in the last 7 days.
  attack: [T1567.002]
  roles: [network, cloud, log_search]
- name: Phishing attachment to process
  hypothesis: A user opened an email attachment that then started a script host or command shell in the last 7 days.
  attack: [T1566.001, T1204.002]
  roles: [email, endpoint, log_search]
- name: Mass file changes
  hypothesis: One process renamed or rewrote a very large number of files in a short time in the last 24 hours.
  attack: [T1486]
  roles: [endpoint, log_search]
# ---- baseline and rarity hunts ----
- name: First-seen process on servers
  hypothesis: A process name ran on a server in the last 24 hours that never ran on any server in the 14 days before.
  attack: [T1204, T1059]
  roles: [endpoint, log_search]
- name: Rare parent-child process pair
  hypothesis: A parent and child process pair appeared on only one or two hosts in the last 7 days and involves a shell or script host.
  attack: [T1059]
  roles: [endpoint, log_search]
- name: First-seen external destination
  hypothesis: A host contacted an external IP or domain in the last 24 hours that no host contacted in the 14 days before, and kept contacting it.
  attack: [T1071]
  roles: [network, log_search]
- name: New service installed
  hypothesis: A service name was installed in the last 7 days that was never seen in the baseline before it, especially with a binary in a user-writable path.
  attack: [T1543.003]
  roles: [endpoint, log_search]
- name: Rare user agent
  hypothesis: A user agent string seen on fewer than three hosts in the last 7 days made outbound web requests.
  attack: [T1071.001]
  roles: [network, log_search]
- name: Account logging in from a first-seen source
  hypothesis: An account signed in successfully from a source IP or device it never used in the previous 30 days.
  attack: [T1078]
  roles: [identity, log_search]
# ---- execution ----
- name: Script host from a download or temp folder
  hypothesis: wscript, cscript or mshta ran a script from a downloads, temp or browser cache folder in the last 7 days.
  attack: [T1059.005, T1059.007]
  roles: [endpoint, log_search]
- name: WMI process creation
  hypothesis: A process was started through WMI (WmiPrvSE as parent) that is a shell, script host or LOLBin in the last 7 days.
  attack: [T1047]
  roles: [endpoint, log_search]
- name: Unix shell from a web server
  hypothesis: A web server or application server process started a shell or a network tool on a Linux host in the last 7 days.
  attack: [T1059.004, T1505.003]
  roles: [endpoint, log_search]
- name: Python or Perl one-liner with a network connection
  hypothesis: An interpreter ran an inline command (-c or -e) that opened a socket or downloaded content in the last 7 days.
  attack: [T1059.006]
  roles: [endpoint, log_search]
- name: Office macro writing executables
  hypothesis: An Office application wrote an executable, script or DLL to disk in the last 7 days.
  attack: [T1204.002, T1137]
  roles: [endpoint, log_search]
# ---- persistence ----
- name: Startup folder drop
  hypothesis: A file was written to a user or all-users Startup folder in the last 7 days.
  attack: [T1547.001]
  roles: [endpoint, log_search]
- name: New cron job or systemd unit
  hypothesis: A cron entry, systemd unit or timer was created or changed on a Linux host outside package installs in the last 7 days.
  attack: [T1053.003, T1543.002]
  roles: [endpoint, log_search]
- name: SSH authorized_keys change
  hypothesis: An authorized_keys file was modified for any account in the last 7 days.
  attack: [T1098.004]
  roles: [endpoint, log_search]
- name: WMI event subscription
  hypothesis: A permanent WMI event filter, consumer or binding was created in the last 30 days.
  attack: [T1546.003]
  roles: [endpoint, log_search]
- name: Image file execution options hijack
  hypothesis: A Debugger or GlobalFlag value was set under Image File Execution Options in the last 30 days.
  attack: [T1546.012]
  roles: [endpoint, log_search]
- name: Web shell on a web server
  hypothesis: A new script file appeared in a web server's content folder and was then requested from outside in the last 7 days.
  attack: [T1505.003]
  roles: [endpoint, network, log_search]
# ---- privilege escalation and defence evasion ----
- name: UAC bypass pattern
  hypothesis: An auto-elevating Windows binary started an unexpected child process, or an HKCU class/shell registry key was written just before one ran, in the last 7 days.
  attack: [T1548.002]
  roles: [endpoint, log_search]
- name: Sudo or su abuse
  hypothesis: An account ran sudo or su to root that does not normally do so, or many sudo failures came from one account, in the last 7 days.
  attack: [T1548.003]
  roles: [endpoint, log_search]
- name: Process injection indicators
  hypothesis: A process opened another process with write or thread-creation rights where the source is not a security or system tool, in the last 7 days.
  attack: [T1055]
  roles: [endpoint, log_search]
- name: Masquerading binary name
  hypothesis: A binary with a system process name (svchost, lsass, csrss, services) ran from a path other than the system folders in the last 7 days.
  attack: [T1036.005]
  roles: [endpoint, log_search]
- name: Timestomping or hidden files
  hypothesis: File timestamps were changed to an older date, or files were marked hidden/system, in a user or temp folder in the last 7 days.
  attack: [T1070.006, T1564.001]
  roles: [endpoint, log_search]
- name: Firewall rule added or disabled
  hypothesis: A host firewall rule was added that allows inbound access, or the firewall was turned off, in the last 7 days.
  attack: [T1686]
  roles: [endpoint, log_search]
- name: Linux log or history tampering
  hypothesis: Shell history was cleared or disabled, or a system log file was truncated or deleted, in the last 7 days.
  attack: [T1685.006, T1070.003]
  roles: [endpoint, log_search]
# ---- credential access ----
- name: Kerberoasting
  hypothesis: One account requested service tickets for many different service accounts with weak encryption in a short window in the last 7 days.
  attack: [T1558.003]
  roles: [identity, log_search]
- name: AS-REP roasting
  hypothesis: Kerberos pre-authentication was not required for ticket requests on several accounts from one source in the last 7 days.
  attack: [T1558.004]
  roles: [identity, log_search]
- name: Directory replication from a non-controller
  hypothesis: A directory replication request (DCSync) came from a host or account that is not a domain controller in the last 30 days.
  attack: [T1003.006]
  roles: [identity, log_search]
- name: Registry hive or NTDS copy
  hypothesis: The SAM, SYSTEM or SECURITY hive, or the directory database, was saved or copied (reg save, shadow copy, ntdsutil) in the last 30 days.
  attack: [T1003.002, T1003.003]
  roles: [endpoint, log_search]
- name: Brute force against one account
  hypothesis: One account had many failed sign-ins from several sources followed by a success in the last 24 hours.
  attack: [T1110.001]
  roles: [identity, log_search]
- name: MFA fatigue
  hypothesis: One account received many MFA prompts in a short time, followed by an approval, in the last 7 days.
  attack: [T1621]
  roles: [identity, log_search]
- name: Browser credential store access
  hypothesis: A process other than the browser read browser credential or cookie files in the last 7 days.
  attack: [T1555.003]
  roles: [endpoint, log_search]
# ---- discovery and lateral movement ----
- name: Burst of discovery commands
  hypothesis: One user or process ran several discovery commands (whoami, net group, nltest, systeminfo, ipconfig) within a few minutes in the last 7 days.
  attack: [T1087, T1069, T1082, T1016]
  roles: [endpoint, log_search]
- name: Internal port scan
  hypothesis: One internal host connected to many hosts or ports with mostly failed connections in a short window in the last 24 hours.
  attack: [T1046]
  roles: [network, log_search]
- name: RDP from an unusual source
  hypothesis: A remote desktop sign-in came from a workstation or account that does not normally use RDP to that host in the last 7 days.
  attack: [T1021.001]
  roles: [identity, endpoint, log_search]
- name: Remote PowerShell or WinRM use
  hypothesis: WinRM or remote PowerShell sessions were opened between workstations, or by an account that does not normally use them, in the last 7 days.
  attack: [T1021.006]
  roles: [endpoint, network, log_search]
- name: SSH lateral movement
  hypothesis: An internal host made SSH connections to several other internal hosts it does not normally reach in the last 7 days.
  attack: [T1021.004]
  roles: [network, endpoint, log_search]
- name: Pass-the-hash pattern
  hypothesis: NTLM network sign-ins with the same account came from several hosts in a short time, without an interactive sign-in first, in the last 7 days.
  attack: [T1550.002]
  roles: [identity, log_search]
# ---- collection, exfiltration and impact ----
- name: Archive created before transfer
  hypothesis: A large archive (zip, rar, 7z) was created in a temp or user folder and an outbound transfer followed within an hour, in the last 7 days.
  attack: [T1560.001, T1041]
  roles: [endpoint, network, log_search]
- name: Data staged on a network share
  hypothesis: Many files from different folders were copied to one network share or local staging folder by one account in the last 7 days.
  attack: [T1074]
  roles: [endpoint, log_search]
- name: Large outbound transfer at night
  hypothesis: A host sent far more data to one external destination outside working hours than it does normally, in the last 7 days.
  attack: [T1048, T1029]
  roles: [network, log_search]
- name: Email forwarding rule to an outside address
  hypothesis: A mailbox rule was created that forwards or redirects mail to an external address in the last 30 days.
  attack: [T1114.003]
  roles: [email, log_search]
- name: Shadow copy deletion
  hypothesis: Volume shadow copies or backup catalogs were deleted, or recovery was disabled, in the last 7 days.
  attack: [T1490]
  roles: [endpoint, log_search]
- name: Service stop spree
  hypothesis: One process or account stopped many services (databases, backups, security) within a short time in the last 7 days.
  attack: [T1489]
  roles: [endpoint, log_search]
# ---- cloud and identity ----
- name: Cloud access key used from a new location
  hypothesis: A cloud access key or service principal was used from an IP range or region it never used in the previous 30 days.
  attack: [T1078.004]
  roles: [cloud, log_search]
- name: Cloud logging disabled
  hypothesis: A cloud audit trail, log export or diagnostic setting was stopped, deleted or narrowed in the last 30 days.
  attack: [T1685]
  roles: [cloud, log_search]
- name: New cloud admin or role assignment
  hypothesis: An identity was given an owner, admin or broad role on a subscription, project or account in the last 7 days.
  attack: [T1098.003]
  roles: [cloud, identity, log_search]
- name: Consent to an unfamiliar application
  hypothesis: A user or admin granted an application broad mail, file or directory permissions in the last 30 days.
  attack: [T1528]
  roles: [identity, cloud, log_search]
- name: Impossible travel
  hypothesis: One account signed in from two distant locations within a time too short to travel between them in the last 7 days.
  attack: [T1078]
  roles: [identity, log_search]
- name: Storage made public
  hypothesis: A cloud storage bucket or container was made publicly readable, or a public share link was created for sensitive data, in the last 30 days.
  attack: [T1530]
  roles: [cloud, log_search]
