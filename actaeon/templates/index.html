<!doctype html>
<html lang="en" data-product="actaeon" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ name }}</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/mdi/css/icons.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/suite.css">
</head>
<body data-quick="cases leads hunts intel" data-name="{{ name }}">
<div class="shell" id="shell">
<div class="scrim" id="scrim"></div>
<aside class="rail" id="rail">
  <a class="brand" href="/"><img class="logo" src="/static/img/logo.svg" alt=""><span class="brand-text">{{ name }}<span class="ver">v{{ version }}</span></span></a>
  <nav id="nav" aria-label="Pages">
    <div class="nav-group">Investigate</div>
    <a href="#leads" data-tab="leads"><span class="mdi mdi-briefcase-outline"></span><span class="lbl">Leads</span></a>
    <a href="#cases" data-tab="cases"><span class="mdi mdi-radar"></span><span class="lbl">Cases</span></a>
    <a href="#hunts" data-tab="hunts"><span class="mdi mdi-target"></span><span class="lbl">Hunts</span></a>
    <a href="#dfir" data-tab="dfir" class="hidden"><span class="mdi mdi-folder-search-outline"></span><span class="lbl">Investigations</span></a>
    <a href="#ask" data-tab="ask"><span class="mdi mdi-chat-question-outline"></span><span class="lbl">Ask</span></a>
    <div class="nav-group">Knowledge</div>
    <a href="#library" data-tab="library"><span class="mdi mdi-bookshelf"></span><span class="lbl">Library</span></a>
    <a href="#intel" data-tab="intel"><span class="mdi mdi-shield-search"></span><span class="lbl">Intel</span></a>
    <a href="#entities" data-tab="entities"><span class="mdi mdi-account-network-outline"></span><span class="lbl">Entities</span></a>
    <a href="#coverage" data-tab="coverage"><span class="mdi mdi-grid"></span><span class="lbl">Coverage</span></a>
    <a href="#rules" data-tab="rules" class="hidden"><span class="mdi mdi-shield-check-outline"></span><span class="lbl">Rules</span></a>
    <a href="#reports" data-tab="reports"><span class="mdi mdi-file-chart-outline"></span><span class="lbl">Reports</span></a>
    <div class="nav-group">System</div>
    <a href="#connectors" data-tab="connectors"><span class="mdi mdi-connection"></span><span class="lbl">Connectors</span></a>
    <a href="#settings" data-tab="settings"><span class="mdi mdi-cog"></span><span class="lbl">Settings</span></a>
  </nav>
  <span id="me" class="me small"></span>
</aside>
<div class="stage">
<header class="topbar">
  <button class="icon-btn" id="menuBtn" type="button" aria-label="Open or close navigation" aria-controls="rail" aria-expanded="false"><span class="mdi mdi-menu"></span></button>
  <h1 id="pageTitle"></h1><span class="spacer"></span>
  <button class="icon-btn" id="themeBtn" title="Dark or light theme" type="button" aria-label="Switch between dark and light theme"><span class="mdi mdi-weather-night"></span></button>
  <button class="icon-btn" id="drawerToggle" type="button" data-need="op" aria-label="Open or close the assistant" aria-expanded="false" title="Assistant (Ctrl+I)"><span class="mdi mdi-robot-outline"></span></button>
</header>
{% if demo %}<div class="demo-banner" role="region" aria-label="Demo notice"><span class="mdi mdi-flask-outline"></span> Demo: all data here is synthetic sample data, not real events.</div>{% endif %}
<main id="main"></main>
</div>
<aside class="ai-drawer closed" id="aiDrawer" aria-label="Assistant" data-need="op">
  <div class="drawer-header"><div class="drawer-title"><span class="mdi mdi-robot-outline"></span>Assistant</div><span class="spacer"></span>
    <button class="icon-btn" id="chatNew" type="button" aria-label="New conversation" title="New conversation"><span class="mdi mdi-plus"></span></button>
    <button class="icon-btn" id="drawerClose" type="button" aria-label="Close the assistant" title="Close"><span class="mdi mdi-close"></span></button></div>
  <div class="drawer-messages" id="chatMessages" aria-live="polite"></div>
  <div class="drawer-input-bar"><textarea id="chatInput" rows="1" placeholder="Ask a question" aria-label="Message the assistant"></textarea>
    <button id="chatSend" type="button" aria-label="Send message" title="Send"><span class="mdi mdi-send"></span></button></div>
</aside>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="tip" class="soc-tip hidden" role="tooltip"></div>
<script src="/static/soc.js"></script>
<script src="/static/rules.js"></script>
<script src="/static/dfir.js"></script>
<script src="/static/app.js"></script>
<script src="/static/suite.js"></script>
</body>
</html>
