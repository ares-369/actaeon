title: Brute force, password spraying and failed sign-ins
match:
  keywords:
  - failed sign
  - failed login
  - logon failure
  - brute
  - spray
  - authentication failure
  - password
  attack:
  - T1110*
steps:
- Count failures from the source and how many different accounts it tried (spraying = many accounts, few tries each).
- Check for any SUCCESSFUL sign-in from the same source or for the targeted accounts after the failures.
- Is the source internal or external? Is it a known scanner, VPN or proxy?
- 'For a single user: is a few failures normal for them (compare with the last 7 days)?'
- A one-off failure by one user is usually false_positive; propose tuning the threshold.
collect:
- auth
- intel
- context
