title: Encoded or obfuscated scripts and suspicious command lines
match:
  keywords:
  - powershell
  - encoded
  - script
  - command line
  - cmd.exe
  - bash
  - obfuscat
  - -enc
  attack:
  - T1059*
  - T1027*
steps:
- Decode the command line with the analysis tool before judging it.
- 'Find the parent process: an Office app, browser or mail client starting a shell is suspicious; a scheduler or
  management agent may be normal.'
- Has this exact command run before on this host or by this account (a recurring admin task)?
- 'Look for what happened next: network connections, files written, scheduled tasks or services created.'
- Known admin tooling that runs on a schedule is benign; propose tuning scoped to that account or host.
collect:
- decode
- intel
- context
- inventory
- spread
