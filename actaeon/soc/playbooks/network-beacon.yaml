title: Connections to new, rare or known-bad destinations
match:
  keywords:
  - connection
  - beacon
  - domain
  - dns
  - outbound
  - c2
  - first seen
  - rare
  attack:
  - T1071*
  - T1105
  - T1572
  - T1568*
steps:
- Look up the destination in intel tools if any exist.
- 'Count connections over time: regular intervals suggest beaconing.'
- Which process made the connection, and how did that process start?
- Did any other host contact the same destination (scope)?
