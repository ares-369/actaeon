title: Scheduled tasks, services, autoruns, new accounts
match:
  keywords:
  - scheduled task
  - schtasks
  - cron
  - service
  - autorun
  - run key
  - persistence
  - new user
  - account created
  attack:
  - T1053*
  - T1543*
  - T1547*
  - T1136*
steps:
- What creates the task, service or account, and what does it run?
- Was it created by a deployment or management tool at the usual time?
- Does the thing it runs live in a user-writable or temp folder?
collect:
- inventory
- context
- decode
