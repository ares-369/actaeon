# Actaeon configuration. Copy to config.yaml (or run `actaeon init`).
# Secrets (API keys, passwords) go in .env, never here.

actaeon:
  instance_name: "Actaeon"
  bind_host: "127.0.0.1"     # loopback by default; set auth before exposing
  bind_port: 8601
  external_url: ""           # public URL behind a reverse proxy (OIDC redirects)
  data_dir: ""               # default: <home>/data
  allow_unauthenticated_network: false

auth:
  mode: "none"               # none | basic | local | oidc | proxy
  username: "actaeon"        # basic/local; password in .env ACTAEON_AUTH_PASSWORD
  default_role: "admin"      # admin | operator | viewer
  roles: {}                  # username: role
  group_roles: {}            # identity-provider group: role, e.g. {soc-analysts: operator} (docs/access.md)
  require_group_role: false  # refuse people in none of the group_roles groups
  proxy_groups_header: ""    # proxy mode: header with the user's groups, e.g. X-Forwarded-Groups
  proxy_header: "X-Forwarded-User"
  proxy_trusted_ips: []      # required for proxy mode
  allowed_users: []
  oidc:
    issuer: ""
    client_id: ""            # client secret in .env OIDC_CLIENT_SECRET
    scopes: "openid email profile"
    username_claim: "email"
    groups_claim: "groups"   # claim listing the user's groups (for group_roles and connector access)

# Model per role. Change from Settings > Models in the UI, or here.
llm:
  roles:
    planner:  { provider: "ollama", model: "" }   # hypothesis -> hunt plan
    analyst:  { provider: "ollama", model: "" }   # read results, pivot, verdict
    reporter: { provider: "ollama", model: "" }   # write-up
  providers:
    ollama:
      base_url: "http://localhost:11434"
      default_model: "qwen2.5:7b"
      num_ctx: 8192            # context window asked of Ollama (its own default cuts long prompts)
      timeout_sec: 300
      # think: false          # reasoning models (e.g. qwen3): false skips the thinking step, faster
    anthropic:
      default_model: ""        # ANTHROPIC_API_KEY in .env
    gemini:                    # see docs/models.md for every way to connect
      auth: auto               # auto | api_key | vertex | vertex_api_key
      default_model: ""        # e.g. a current Flash or Pro model
      project: ""              # Vertex AI project (or GOOGLE_CLOUD_PROJECT)
      location: global
      credentials_file: ""     # service-account key or workload identity config (optional)
      base_url: ""             # AI gateway or proxy (optional)
    openai:
      default_model: ""        # OPENAI_API_KEY in .env
    azure_openai:
      base_url: ""             # AZURE_OPENAI_API_KEY in .env
      api_version: "2024-10-21"
    openai_compatible:
      base_url: ""             # OPENAI_COMPAT_API_KEY in .env
      default_model: ""
    cli:                       # a model CLI you are signed in to on this machine
      command: []              # e.g. ["/path/to/cli", "--model", "{model}", "-p={prompt}"]
      default_model: ""
      timeout_sec: 180

# Describe your environment so hunts fit it (all optional).
environment: {}
#  summary: "Mostly Windows endpoints, a few Linux web servers, one cloud tenant."
#  platforms: [windows, linux, cloud]
#  products: ["<web server>", "<ssh server>"]   # what runs here, by name; decides which news items are worth a hunt
#  crown_jewels: ["payroll database", "domain controllers"]
#  not_present: ["macOS", "on-prem email"]
#  known_good: ["<your own service names>", "nightly backup job"]   # normal here; misuse is still reported
#  notes: ["Admins use a jump host for remote work"]

# Mask personal data before prompts go to cloud models (restored in replies).
# Local models (ollama) are not masked unless listed. See docs/privacy.md.
privacy:
  mask_for: [anthropic, gemini, openai, azure_openai, openai_compatible, cli]
  types: [email, ipv4, ipv6, user]
  terms: []          # e.g. your company and domain names
  patterns: []       # extra regexes, e.g. '\bWS-\d{4,}\b' for hostnames
  keep_public_ips: false

# Actaeon as an MCP server: `actaeon mcp` (stdio) or POST /mcp (HTTP, behind login).
mcp:
  token_env: ""              # e.g. ACTAEON_MCP_TOKEN: bearer token accepted on /mcp only
  token_role: operator       # role for that token: viewer | operator | admin
  allow_intel_writes: false  # let MCP clients add indicators
  expose: []                 # empty = all tools; or list tool names

# Autopilot: propose hypotheses from new intel, coverage gaps and follow-ups, then hunt them.
autopilot:
  interval_minutes: 0        # 0 = only by hand (actaeon autopilot / UI)
  max_hunts_per_run: 3
  max_hunts_per_day: 12
  avoid_repeat_days: 7

# Hunt safety limits.
hunt:
  max_steps: 25
  verify: true               # second look on threats: tries to prove each threat wrong (extra model calls)
  resume_on_restart: true    # continue hunts a restart interrupted (at most twice)
  profiles: {}               # override or add hunt profiles (quick, standard, deep); see docs/hunting.md
  max_runtime_sec: 900
  max_result_bytes: 8000     # per tool result shown to the model (search hits are compacted)
  max_results: 200           # cap on size/limit arguments of any tool
  max_query_sec: 120         # one tool call, retries included (also never past max_runtime_sec); 0 = no cap
  library_dirs: []           # extra hunt-pack folders (one YAML per hunt, see docs/hunt-packs.md)
  max_tokens: 0              # model tokens (in + out) per hunt; when reached the hunt must give its verdict. 0 = no cap
  prompt_mode: full          # full | compact (shorter prompts, fewer tokens, for small models)
  handoff: [inconclusive, logs_missing, unverified_threat, error, known_good_threat, injection]   # hand these to an analyst

# Replies from a ticket system continue a hunt: POST /api/tickets/reply (see docs/outputs.md).
tickets:
  token_env: ""              # env var holding a bearer token the ticket system sends (valid on that path only)

# Storage. Empty url: SQLite in the data folder (nothing to install). PostgreSQL is optional:
# pip install 'actaeon[postgres]', then `actaeon init --database postgres --db-url ...` (writes ACTAEON_DB_URL
# to .env), or set url here with the password from .env, e.g. "postgresql://actaeon:${DB_PASSWORD}@db/actaeon".
database:
  url: ""
  schema: actaeon

# Entities across hunts: "recurring" = in this many hunts within the window, at least one unresolved.
entities:
  recurring_hunts: 3
  window_days: 14

# Inventory drift: what is new on each host since the last snapshot (no model). See docs/drift.md.
drift:
  interval_minutes: 0
  escalate: false
  targets: []
#    - name: listening-ports
#      connector: inventory
#      index: "inventory-ports-*"
#      host_field: host.name
#      item_fields: [source.port, network.transport, process.name]
#      query: "interface.state:listening"

# Identity for the scheduler's own work (sweeps, autopilot, web intel); see docs/access.md.
# Without it that work may use every connector. Saved-hunt replays always run as their owner.
#scheduler:
#  groups: [soc-automation]
#  role: operator

# Retention: delete finished hunts (and their steps, chat, drafts, entities, closed leads) after N days.
# 0 keeps everything. Hunts with an open lead and the audit log are never deleted. See docs/deploy.md.
retention:
  hunts_days: 0
  jobs_days: 30

# Background jobs. local: the server runs them. queue: `actaeon worker` processes run them (docs/deploy.md).
jobs:
  mode: local                # local | queue
  threads: 3                 # jobs at once inside the server (local mode)
  stale_after_sec: 600       # queue mode: a running job with no worker heartbeat for this long is interrupted

# Hunt memory (analyst notes added to related hunts).
memory:
  benign_note_days: 90       # notes made from a benign / false-positive call stop being used after this; 0 = never

# Local intel store: add indicators and advisories yourself (UI, API, CLI)
# and pull feeds. Served to hunts as the built-in read-only "local-intel"
# connector (role: intel). See docs/intel.md.
intel:
  local: true
  allow_private_urls: false   # advisory import from internal URLs
  feeds: []
  sweep:
    interval_minutes: 0
    triage: rules             # rules | model | off: was each match executed, blocked or only mentioned?
  web:                        # web intel (see docs/autonomy.md)
    interval_minutes: 0       # > 0: pull sources on a schedule
    auto_hunt: false          # start an advisory hunt for each new advisory that is relevant here
    max_hunts_per_pull: 3     # at most this many hunts per pull
    relevance: {model: true, min_score: 50, terms: []}   # see docs/autonomy.md
    tools: false              # give hunts public-web lookups (fetch_page, search_web)
    search_url: ""            # JSON search endpoint for search_web (optional)
    sources: []               # [{name, url, kind: feed|page, keywords: [], max_items: 10}]
#  - name: exploited-cves
#    url: "https://example.org/known_exploited.json"
#    format: json            # text | csv | stix | json
#    list_key: vulnerabilities
#    value_field: cveID
#    type: cve
#    confidence: 90
#    tags: [exploited]

# Intel sweeps (no model): search logs for new or changed indicators.
# Set interval_minutes > 0 to run on a schedule; `actaeon sweep` runs one now.
#  sweep:
#    interval_minutes: 0
#    lookback: now-7d
#    min_confidence: 50
#    targets: []        # empty = every search-index bridge connector

# Outputs: send results when hunts finish (email, webhook, mcp_tool, taxii).
# See docs/outputs.md. `actaeon outputs test NAME` sends a sample.
outputs: []
